[project]
name = "xrf55-wifi-har"
version = "0.1.0"
description = "Wi-Fi CSI human activity recognition on the XRF55 dataset"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5",
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "tqdm",
    "h5py",
]

[dependency-groups]
dev = ["ruff==0.16.10"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.format]
# keep upstream quote style to minimize changes
quote-style = "preserve"

[tool.ruff.lint]
# pyflakes and basic pycodestyle errors, plus import sorting
select = ["E4", "E7", "E9", "F", "I"]
